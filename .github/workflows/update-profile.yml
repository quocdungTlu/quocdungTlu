name: Update profile

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-readme.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fails the job on an API error, which leaves README.md untouched
      # rather than committing a half-built page.
      - name: Build README
        run: node scripts/build-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent work"
          git push

      # The evidence column in the essay table is a hand-written judgement, so a newly
      # published essay is reported here instead of being auto-inserted with a placeholder.
      - name: Report essay drift
        if: hashFiles('drift.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Profile README is missing an essay published on the site"
          if [ -n "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            echo "issue already open"
            exit 0
          fi
          gh issue create --title "$title" --body "$(printf 'These essays are linked from %s but not named in the profile README:\n\n```\n%s\n```\n\nAdd a row to the table, including the evidence behind the essay.\n' "https://quocdungtlu.github.io" "$(cat drift.txt)")"
